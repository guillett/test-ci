---
name: Test CI

on:
  push:
    branches: [main]

jobs:
  push-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false

      - name: Add tag on GitHub
        run: |
          uv version --short
          git tag `uv version --short`
          git push --tags
