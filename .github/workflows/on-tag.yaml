---
name: On tag

on:
  workflow_run:
    workflows: [Test CI]
    types: [completed]

jobs:
  test-on-windows:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Add tag on GitHub
        run: |
          uv version --short
