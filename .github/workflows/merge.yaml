---
name: Test CI

on:
  push:
    branches: [main]
  pull_request:
    types: [assigned, opened, reopened, synchronize, ready_for_review]

jobs:
  push-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false

      - name: Fail message
        run: |
          echo "::error ::Missing semicolon"
          exit 1



